name: Deploy PHP Frontend to Pages

on:
  push:
    branches: ["main"] # Change to your default branch name if different

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Match your local PHP version

      - name: Create distribution folder
        run: mkdir -p dist

      - name: Generate static HTML from PHP
        # Replace this line with your specific build scripts or framework commands
        run: php index.php > dist/index.html 

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Points to the folder containing your generated HTML files

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
